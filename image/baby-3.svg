<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="tetBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="50%" stop-color="#fee2e2" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <filter id="tetShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#b91c1c" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#tetBg)" />

  <!-- Bamboo mat texture / Backdrop -->
  <line x1="100" y1="120" x2="700" y2="120" stroke="#d97706" stroke-width="2" opacity="0.3"/>
  <line x1="100" y1="140" x2="700" y2="140" stroke="#d97706" stroke-width="2" opacity="0.3"/>
  <line x1="100" y1="160" x2="700" y2="160" stroke="#d97706" stroke-width="2" opacity="0.3"/>

  <!-- Red Lanterns & Mai Flowers -->
  <g transform="translate(680, 150)">
    <ellipse cx="0" cy="30" rx="40" ry="50" fill="#dc2626"/>
    <rect x="-15" y="-5" width="30" height="10" fill="#fbbf24"/>
    <rect x="-15" y="65" width="30" height="10" fill="#fbbf24"/>
    <line x1="0" y1="75" x2="0" y2="120" stroke="#fbbf24" stroke-width="3"/>
  </g>

  <!-- Yellow Mai Blossom Branches -->
  <path d="M 80 180 Q 220 140 320 220" stroke="#78350f" stroke-width="5" fill="none"/>
  <circle cx="160" cy="160" r="14" fill="#fbbf24"/>
  <circle cx="160" cy="160" r="5" fill="#b45309"/>
  <circle cx="240" cy="165" r="16" fill="#fbbf24"/>
  <circle cx="240" cy="165" r="6" fill="#b45309"/>
  <circle cx="290" cy="210" r="13" fill="#fbbf24"/>

  <!-- Traditional Banh Chung & Bamboo bed -->
  <g transform="translate(140, 720)">
    <rect x="0" y="0" width="110" height="90" rx="8" fill="#15803d" stroke="#166534" stroke-width="3"/>
    <line x1="0" y1="45" x2="110" y2="45" stroke="#fef08a" stroke-width="4"/>
    <line x1="55" y1="0" x2="55" y2="90" stroke="#fef08a" stroke-width="4"/>
  </g>

  <!-- Baby in Crimson Red Velvet Ao Dai -->
  <g transform="translate(400, 480)" filter="url(#tetShadow)">
    <!-- White trousers -->
    <path d="M -50 160 L -60 270 L 60 270 L 50 160 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Red Velvet Ao Dai Gown -->
    <path d="M -60 30 Q 0 45 60 30 L 75 250 Q 0 265 -75 250 Z" fill="#991b1b" stroke="#7f1d1d" stroke-width="3"/>
    <!-- Gold floral embroidery on chest -->
    <circle cx="0" cy="80" r="10" fill="#fbbf24"/>
    <circle cx="-15" cy="70" r="6" fill="#fde047"/>
    <circle cx="15" cy="70" r="6" fill="#fde047"/>
    <circle cx="-12" cy="95" r="6" fill="#fde047"/>
    <circle cx="12" cy="95" r="6" fill="#fde047"/>
    <path d="M -30 110 Q 0 135 30 110" stroke="#fbbf24" stroke-width="2" fill="none"/>

    <!-- Arms -->
    <ellipse cx="-55" cy="45" rx="16" ry="36" transform="rotate(25, -55, 45)" fill="#991b1b"/>
    <ellipse cx="55" cy="45" rx="16" ry="36" transform="rotate(-25, 55, 45)" fill="#991b1b"/>

    <!-- Baby Hands holding Red Envelope (Bao Lì Xì) -->
    <g transform="translate(0, 110)">
      <!-- Red Lucky Envelope -->
      <rect x="-24" y="-35" width="48" height="70" rx="6" fill="#dc2626" stroke="#fbbf24" stroke-width="2" transform="rotate(8)"/>
      <circle cx="2" cy="0" r="12" fill="#fbbf24"/>
      <text x="2" y="5" font-family="sans-serif" font-size="12" font-weight="bold" fill="#991b1b" text-anchor="middle">福</text>
      <!-- Tiny chubby hands -->
      <circle cx="-20" cy="5" r="12" fill="#fed7aa"/>
      <circle cx="22" cy="5" r="12" fill="#fed7aa"/>
    </g>

    <!-- Head & Cheeks -->
    <ellipse cx="0" cy="-60" rx="72" ry="76" fill="#fed7aa"/>
    <ellipse cx="-42" cy="-45" rx="16" ry="10" fill="#ef4444" opacity="0.38"/>
    <ellipse cx="42" cy="-45" rx="16" ry="10" fill="#ef4444" opacity="0.38"/>

    <!-- Cute Eyes -->
    <ellipse cx="-26" cy="-65" rx="7" ry="10" fill="#1e293b"/>
    <circle cx="-24" cy="-68" r="3" fill="#ffffff"/>
    <ellipse cx="26" cy="-65" rx="7" ry="10" fill="#1e293b"/>
    <circle cx="28" cy="-68" r="3" fill="#ffffff"/>
    <path d="M -15 -35 Q 0 -22 15 -35" stroke="#b91c1c" stroke-width="3.5" fill="#fecaca" stroke-linecap="round"/>

    <!-- Double Pigtails -->
    <path d="M -60 -105 C -105 -140, -115 -95, -70 -80 Z" fill="#1e293b"/>
    <circle cx="-62" cy="-95" r="8" fill="#dc2626"/>
    <path d="M 60 -105 C 105 -140, 115 -95, 70 -80 Z" fill="#1e293b"/>
    <circle cx="62" cy="-95" r="8" fill="#dc2626"/>

    <!-- Hair Bangs -->
    <path d="M -72 -70 C -70 -125, 70 -125, 72 -70 C 60 -90, 20 -100, 0 -88 C -20 -100, -60 -90, -72 -70 Z" fill="#1e293b"/>

    <!-- Traditional Red Velvet Headband (Mấn đỏ) -->
    <path d="M -56 -96 Q 0 -115 56 -96" stroke="#991b1b" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M -56 -96 Q 0 -115 56 -96" stroke="#fbbf24" stroke-width="2" fill="none"/>
  </g>

  <!-- Badge in Image -->
  <g transform="translate(400, 910)">
    <rect x="-190" y="-35" width="380" height="70" rx="35" fill="#ffffff" opacity="0.95" filter="url(#tetShadow)"/>
    <text x="0" y="5" font-family="'Playfair Display', serif" font-size="24" font-weight="bold" fill="#991b1b" text-anchor="middle">Áo Dài Sum Vầy</text>
    <text x="0" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#b91c1c" text-anchor="middle">Nét Duyên Đáng Yêu Ngày Tết</text>
  </g>
</svg>
